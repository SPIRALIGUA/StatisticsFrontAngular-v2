<div class="row">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 col-md-12 text-center">
                <div class="jumbotron" style="margin-bottom:0px;padding: 0px 5px;">
                    <h1>Bienvenido </h1><br><br>
                    <strong style="position:relative; font-size: 30px;top: -25px;">Módulo de {{nombre_modulo}}</strong>
                </div>
                <hr>
                <div>
                    <div id="clock">
                        <strong class="date">{{actualDate | date: "MM-dd-yyyy"}} {{weekday}}</strong><br><br>
                        <p class="time">{{actualDate | date: "h:mm:ss a"}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 col-md-12 text-center">
            <br />
            <img id="logo_image" src="./assets/img/logo-picasso.png" class="img-fluid" alt="Logo Sunshine Bouquet"
                style="height:450px; width:auto;">
        </div>
    </div>
</div>
